name: Corvus Enterprise CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-and-lint:
    name: Test & Lint Backend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest httpx
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Flake8 Linter
      run: |
        flake8 backend tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Pytest
      run: |
        pytest tests/ -v

  docker-build:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: test-and-lint
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Test Docker Compose Build
      run: |
        docker-compose build
